<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Liam Graham actor portfolio — site preview pending">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46204F"/>
      <stop offset="1" stop-color="#2A1E3F"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <g filter="url(#soft)" opacity="0.55">
    <circle cx="1140" cy="220" r="230" fill="#FFA61E"/>
    <circle cx="1310" cy="470" r="200" fill="#E0369B"/>
    <circle cx="960" cy="620" r="190" fill="#A57ACC"/>
  </g>

  <g style="mix-blend-mode:screen" opacity="0.9">
    <circle cx="1080" cy="330" r="150" fill="#6B3178"/>
    <circle cx="1220" cy="400" r="150" fill="#8E3F86"/>
  </g>

  <text x="120" y="330" font-family="Baloo 2, Trebuchet MS, sans-serif" font-size="150" font-weight="800" fill="#FFF8EF" letter-spacing="-2">Liam</text>
  <text x="120" y="470" font-family="Baloo 2, Trebuchet MS, sans-serif" font-size="150" font-weight="800" fill="#FFA61E" letter-spacing="-2">Graham</text>
  <text x="126" y="545" font-family="Inter, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#D9B8EC" letter-spacing="6">ACTOR · PORTFOLIO SITE</text>

  <g transform="translate(120 640)">
    <rect width="250" height="64" rx="32" fill="#FFA61E"/>
    <text x="125" y="41" text-anchor="middle" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2A1E3F">Visit the site</text>
  </g>

  <text x="1320" y="820" text-anchor="end" font-family="Baloo 2, Trebuchet MS, sans-serif" font-size="190" font-weight="800" fill="#FFF8EF" opacity="0.16">&#8221;</text>
</svg>
